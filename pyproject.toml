[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-aligned-llm-router"
version = "0.1.0"
description = "A calibrated safety router for open-weight LLM tiers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0",
  "huggingface-hub==0.36.2",
  "math-verify==0.5.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "peft==0.17.1",
  "pyarrow>=16",
  "scikit-learn>=1.4",
  "sympy==1.13.3",
  "torch>=2.4",
  "transformers==4.53.1",
]

[project.scripts]
llm-router-benchmark = "llm_router.benchmark_cli:main"

[project.optional-dependencies]
notebook = [
  "gradio>=4.44",
  "ipywidgets>=8",
  "jupyterlab>=4",
  "matplotlib>=3.8",
]
quantization = ["bitsandbytes>=0.43"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["results"]
